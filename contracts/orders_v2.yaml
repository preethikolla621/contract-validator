name: orders
version: 2
columns:
  - {name: order_id, type: string, nullable: false, primary_key: true}
  - {name: customer_id, type: string, nullable: false, references: customers.customer_id}
  - {name: status, type: string, nullable: false, allowed_values: [placed, shipped, cancelled, returned]}
  - {name: amount, type: decimal, nullable: false, min: 0}
  - {name: event_ts, type: timestamp, nullable: false}
  - {name: coupon_code, type: string, nullable: true}